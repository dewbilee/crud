spring:
  datasource:
    url: jdbc:mysql://demo-db-instance.cx6i6esog44e.ap-southeast-2.rds.amazonaws.com/demo-db-instance
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  servlet:
    context-path: /portal/api