name: Unit Test - Spring Boot (Java 21)

on:
  push:
    branches: [ "staging" ]

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests
        run: mvn clean test
